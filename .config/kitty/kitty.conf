#kitty.conf

include ./theme.conf


font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      Operator Mono Bold Italic
bold_italic_font auto
font_size        11

mouse_hide_wait 3.0

enable_audio_bell no

window_padding_width 5
hide_window_decorations titlebar-only

background_opacity 0.95
dynamic_background_opacity yes

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9





#  λ opt

# mac - font_family Terminess Nerd Font - font_size 12
# monitor - font_family Terminess Nerd Font - font_size 9
# mac - font_family JetBrainsMono Nerd Font Mono - font_size 11
# monitor - font_family JetBrainsMono Nerd Font Mono - font_size 8
# mac - font_family Maple Mono NL NF - font_size 11
# monitor - font_family Maple Mono NL NF - font_size ??? 





# + keybinds

map cmd+v paste_from_clipboard
map cmd+, load_config_file

map cmd+equal       change_font_size all +2.0
map cmd+plus        change_font_size all +2.0
map shift+cmd+equal change_font_size all +2.0

map cmd+minus       change_font_size all -2.0
map shift+cmd+minus change_font_size all -2.0

map cmd+0           change_font_size all 0

map cmd+shift+f toggle_fullscreen
map cmd+q close
